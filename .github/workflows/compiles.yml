# This check answers one question:
#
#     does your code — and the tests that check it — still compile?
#
# It does NOT run the tests. You run those yourself, in IntelliJ, one day at a time.
# A green check means Java accepted your code. It does not mean your answers are right.
name: compiles

on:
  push:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile code and tests
        run: ./mvnw -B test-compile
